name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Test
        # The physics tests carry the weight here: they fail if the integrator
        # starts injecting energy, which would silently change the task the
        # agent is solving without changing anything visible in a reward curve.
        run: python -m pytest tests/ -q
